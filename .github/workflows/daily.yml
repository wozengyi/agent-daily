name: Agent Daily Build & Deploy

on:
  schedule:
    - cron: '35 */3 * * *'
  workflow_dispatch:
    inputs:
      backfill_years:
        description: 'Set >0 to run a multi-year backfill before the daily build'
        required: false
        default: '0'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: (Optional) Backfill multi-year history
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_years != '0') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[backfill-5y]')) }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 90
          retry_on: error
          command: |
            years="${{ github.event.inputs.backfill_years || '5' }}"
            python build/backfill_years.py --years "$years" --max-per-month 120 --page-size 50 --sleep 1.2

      - name: Generate daily data (with retry)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 25
          retry_on: error
          command: python build/build_daily.py --recent 7 --archive 1825 --limit 240 --archive-limit 0

      - name: Warn on suspicious builds
        run: |
          python - <<'PY'
          import json, os, urllib.request, sys
          from pathlib import Path
          p = Path('data/daily.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          warns = list(data.get('warnings') or [])
          if (data.get('count') or 0) < 15:
              warns.append('low_paper_count')
          if warns:
              print('Warnings:', warns)
              body = (
                f"## Agent Daily build warnings\n\n"
                f"- Generated at: `{data.get('generatedAt')}`\n"
                f"- Latest (7 days): {data.get('count')} (HF={data.get('sources',{}).get('hf')}, arXiv={data.get('sources',{}).get('arxiv')})\n"
                f"- Archive: {data.get('archiveCount')}\n"
                f"- History total: {data.get('historyTotal')}\n"
                f"- Added today: {data.get('addedToday')}\n\n"
                f"Warnings: {', '.join(warns)}\n\n"
                f"Trigger a manual workflow run with a `backfill_years` parameter to re-seed history if needed."
              )
              token = os.environ.get('GITHUB_TOKEN')
              repo = os.environ.get('GITHUB_REPOSITORY')
              if token and repo:
                  import urllib.parse
                  q = urllib.parse.urlencode({'labels':'daily-builder','state':'open'})
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/issues?{q}',
                      headers={'Authorization': f'Bearer {token}', 'Accept':'application/vnd.github+json'}
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          existing = json.loads(r.read().decode('utf-8'))
                  except Exception: existing = []
                  if existing:
                      url = existing[0]['url']
                      req = urllib.request.Request(url, data=json.dumps({'body': body}).encode(),
                          headers={'Authorization': f'Bearer {token}', 'Content-Type':'application/json'}, method='PATCH')
                      urllib.request.urlopen(req, timeout=10)
                  else:
                      req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/issues',
                          data=json.dumps({'title': f'[bot] Agent Daily build warning', 'body': body, 'labels':['daily-builder']}).encode(),
                          headers={'Authorization': f'Bearer {token}', 'Content-Type':'application/json'}
                      )
                      urllib.request.urlopen(req, timeout=10)
          else:
              print("Build looks healthy.")
          PY

      - name: Commit daily update
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          date=$(date -u +"%Y-%m-%d")
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new data to commit."
          else
            git commit -m "chore: update daily papers $date"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.build.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest generated data
        run: git pull --ff-only origin main
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
